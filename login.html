<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Zomato</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f8f8;
            color: #1c1c1c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Card Header */
        h1 {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 32px 32px 16px;
            border-radius: 12px 12px 0 0;
            font-size: 26px;
            font-weight: 600;
            color: #1c1c1c;
            border: 1px solid #eaeaea;
            border-bottom: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        /* Card Body */
        form {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 8px 32px 32px;
            border-radius: 0 0 12px 12px;
            border: 1px solid #eaeaea;
            border-top: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        /* Hide <br> tags so flexbox handles spacing cleanly */
        form br {
            display: none;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: #4f4f4f;
            margin-top: 14px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            color: #1c1c1c;
            background-color: #ffffff;
            border: 1px solid #cfcfcf;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #9c9c9c;
        }

        input:focus {
            border-color: #ef4f5f;
            box-shadow: 0 0 0 3px rgba(239, 79, 95, 0.14);
        }

        /* Zomato Red Submit Button */
        button[type="submit"] {
            margin-top: 24px;
            width: 100%;
            padding: 13px;
            background-color: #ef4f5f;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button[type="submit"]:hover {
            background-color: #e03546;
        }

        button[type="submit"]:active {
            transform: scale(0.99);
        }
    </style>
</head>

<body>
    <h1>Login to Zomato</h1>

    <form action="/login" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required placeholder="Enter your username..."><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password..."><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email..."><br><br>

        <button type="submit">Login</button>
    </form>
</body>

</html>
