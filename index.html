<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato- order food right at your home!</title>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1c1c1c;
        min-height: 100vh;
        /* Full-page background image with a dark tint for text contrast */
        background-image: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.65)),
            url("https://b.zmtcdn.com/data/pictures/1/18769641/000ff9e7a6d6b62c2f6127d4bf3f1495_o2_featured_v2.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        /* Grid layout for Navbar (Row 1), Main (Row 2), Footer (Row 3) */
        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-rows: auto 1fr auto;
        align-items: center;
    }

    /* Hide the inline background <div> so it doesn't push the navbar down */
    body > div:first-of-type {
        display: none;
    }

    /* ================= TOP NAVBAR ================= */
    body > span:nth-of-type(1) {
        background-color: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(8px);
        padding: 16px 24px 16px max(24px, calc((100vw - 1100px) / 2 + 24px));
        height: 100%;
        display: flex;
        align-items: center;
    }

    body > span:nth-of-type(1) img {
        width: 125px;
        height: auto;
        display: block;
    }

    body > span:nth-of-type(2) {
        display: flex;
        align-items: center;
        justify-self: center;
        width: 92%;
        max-width: 560px;
        background: #ffffff;
        border: 1px solid #e8e8e8;
        border-radius: 8px;
        padding: 11px 16px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        gap: 12px;
        margin: 12px 0;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    body > span:nth-of-type(2):focus-within {
        border-color: #ef4f5f;
        box-shadow: 0 4px 16px rgba(239, 79, 95, 0.25);
    }

    body > span:nth-of-type(2) svg {
        width: 18px;
        height: 18px;
        fill: #828282;
        flex-shrink: 0;
    }

    body > span:nth-of-type(2) label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
    }

    body > span:nth-of-type(2) input {
        border: none;
        outline: none;
        width: 100%;
        font-size: 14px;
        color: #1c1c1c;
        background: transparent;
    }

    body > span:nth-of-type(2) input::placeholder {
        color: #9c9c9c;
    }

    body > span:nth-of-type(3) {
        background-color: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 16px max(24px, calc((100vw - 1100px) / 2 + 24px)) 16px 24px;
        height: 100%;
    }

    body > span:nth-of-type(3) a {
        text-decoration: none;
        color: #4f4f4f;
        font-size: 16px;
        font-weight: 500;
        transition: color 0.2s;
    }

    body > span:nth-of-type(3) a:hover {
        color: #1c1c1c;
    }

    body > span:nth-of-type(3) a:last-child {
        background-color: #ef4f5f;
        color: #ffffff;
        padding: 9px 18px;
        border-radius: 6px;
        transition: background-color 0.2s;
    }

    body > span:nth-of-type(3) a:last-child:hover {
        background-color: #e03546;
    }

    /* ================= MAIN CONTENT ================= */
    main {
        grid-column: 1 / -1;
        align-self: start;
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 56px 24px;
    }

    main h1 {
        font-size: 42px;
        font-weight: 700;
        color: #ffffff;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
        margin-bottom: 12px;
    }

    main > p:first-of-type {
        font-size: 19px;
        color: #f2f2f2;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
        max-width: 650px;
        line-height: 1.5;
        margin-bottom: 44px;
    }

    main h2 {
        font-size: 24px;
        font-weight: 600;
        color: #ffffff;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        margin-bottom: 20px;
    }

    main ul {
        list-style: none;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 16px;
        margin-bottom: 44px;
    }

    main ul li {
        background-color: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 12px;
        padding: 24px 16px;
        text-align: center;
        font-size: 17px;
        font-weight: 600;
        color: #1c1c1c;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
        cursor: pointer;
        transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s, color 0.2s;
    }

    main ul li:hover {
        transform: translateY(-4px);
        background-color: #ffffff;
        border-color: #ef4f5f;
        color: #ef4f5f;
        box-shadow: 0 10px 24px rgba(239, 79, 95, 0.28);
    }

    main > p:last-of-type {
        background-color: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(6px);
        border-left: 4px solid #ef4f5f;
        border-radius: 10px;
        padding: 18px 24px;
        font-size: 16px;
        color: #1c1c1c;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    }

    main > p:last-of-type a {
        color: #ef4f5f;
        font-weight: 600;
        text-decoration: none;
    }

    main > p:last-of-type a:hover {
        text-decoration: underline;
    }

    /* ================= FOOTER ================= */
    footer {
        grid-column: 1 / -1;
        background-color: rgba(20, 20, 20, 0.85);
        backdrop-filter: blur(6px);
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        padding: 22px;
        text-align: center;
        color: #d4d4d4;
        font-size: 14px;
    }

    /* ================= MOBILE RESPONSIVE ================= */
    @media (max-width: 768px) {
        body {
            grid-template-columns: 1fr auto;
            grid-template-rows: auto auto 1fr auto;
        }

        body > span:nth-of-type(1) {
            padding: 16px 20px;
        }

        body > span:nth-of-type(3) {
            padding: 16px 20px;
        }

        body > span:nth-of-type(2) {
            grid-column: 1 / -1;
            grid-row: 2;
            width: calc(100% - 40px);
            max-width: none;
            margin: 12px 20px 8px;
        }

        main h1 {
            font-size: 30px;
        }
    }
</style>
</head>
